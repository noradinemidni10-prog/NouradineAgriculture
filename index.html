<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174b32"><meta name="description" content="Nouradine Agriculture - مساعدك الزراعي الذكي"><link rel="manifest" href="manifest.webmanifest"><title>Nouradine Agriculture – نورالدين للزراعة</title>
<style>
:root{--g:#174b32;--g2:#286b45;--gold:#c7a34b;--cream:#f7f2e6;--ink:#20372a;--muted:#68786d;--line:#e4e8df}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(135deg,#f7f2e6,#edf3e9);color:var(--ink)}header{background:linear-gradient(120deg,#123d29ee,#24583bee),repeating-linear-gradient(90deg,#79502d 0 5px,#8a6039 5px 10px);color:#fff;padding:20px 17px;border-bottom:3px solid var(--gold)}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border:2px solid var(--gold);border-radius:16px;display:grid;place-items:center;font-size:27px;background:#ffffff12}.brand h1{font-size:19px;margin:0}.brand p{margin:4px 0 0;color:#e8dfc7;font-size:12px}.wrap{max-width:980px;margin:auto;padding:16px}.hero{background:linear-gradient(120deg,#174b32,#286b45);color:white;padding:22px;border-radius:22px;box-shadow:0 10px 28px #173e2922;margin-bottom:16px;border:1px solid #c7a34b66}.hero small{color:#e5cc8c}.hero h2{margin:8px 0;font-size:25px}.hero p{line-height:1.8;margin:0;color:#e6efe8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 4px 15px #213c2910}.tile{cursor:pointer;text-align:right;min-height:108px;color:var(--ink)}.tile:active,button:active{transform:scale(.98)}.ico{font-size:25px}.tile b{display:block;margin-top:8px}.tile span:last-child{font-size:12px;color:var(--muted)}.panel{margin-top:14px}.panel h3{margin:0 0 12px;color:var(--g)}.muted{color:var(--muted);font-size:13px;line-height:1.7}label{display:block;font-weight:650;font-size:13px;margin:11px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d9e1d7;border-radius:11px;background:#fbfcf9;font:inherit;color:var(--ink)}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:12px;background:var(--g2);color:white;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}button.secondary{background:#f3ead2;color:#4a3c1d;border:1px solid #e2d2a7}.actions{display:flex;gap:8px;flex-wrap:wrap}.result{white-space:pre-wrap;background:#f1f7ef;border-right:3px solid var(--g2);padding:13px;border-radius:10px;margin-top:12px;line-height:1.8}.result[hidden]{display:none}nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow:auto;gap:5px;padding:8px max(8px,calc((100% - 980px)/2));z-index:3}nav button{white-space:nowrap;margin:0;padding:9px 13px;background:#edf2ec;color:#34513e;font-size:12px}nav button.active{background:var(--g);color:#fff}footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero h2{font-size:31px}}
</style></head><body>
<header><div class="brand"><div class="logo">🌱</div><div><h1>Nouradine Agriculture</h1><p>نورالدين للزراعة · مع نورالدين نحو زراعة ناجحة ومثمرة</p></div></div></header>
<main class="wrap"><section class="hero"><small>مساعدك الزراعي الذكي</small><h2>أهلاً بك أيها الفلاح 🌾</h2><p>معلومات وأدوات زراعية تساعدك في الحقل، بالعربية وبأسلوب قريب من الفلاح الجزائري.</p></section>
<div id="home" class="grid">
<button class="tile" onclick="show('assistant')"><span class="ico">🤖</span><b>المساعد الزراعي</b><span>اسأل عن المحاصيل والري والآفات</span></button>
<button class="tile" onclick="show('diagnosis')"><span class="ico">📷</span><b>تشخيص النبات بالصور</b><span>ارفع صورة للأوراق أو الثمار</span></button>
<button class="tile" onclick="show('crops')"><span class="ico">🌿</span><b>موسوعة المحاصيل</b><span>إرشادات العناية ومراحل النمو</span></button>
<button class="tile" onclick="show('soil')"><span class="ico">🪴</span><b>تحليل التربة</b><span>سجل نتائج التحليل وافهمها</span></button>
<button class="tile" onclick="show('fertilizer')"><span class="ico">🧪</span><b>دليل الأسمدة</b><span>مبادئ التسميد الآمن</span></button>
<button class="tile" onclick="show('pests')"><span class="ico">🐛</span><b>الآفات والأمراض</b><span>المكافحة المتكاملة والآمنة</span></button>
<button class="tile" onclick="show('calculator')"><span class="ico">🧮</span><b>حاسبات المزرعة</b><span>الري والتسميد حسب المساحة</span></button>
<button class="tile" onclick="show('weather')"><span class="ico">☀️</span><b>الطقس الزراعي</b><span>حالة الطقس والتنبيهات</span></button>
<button class="tile" onclick="show('voice')"><span class="ico">🎙️</span><b>المحادثة الصوتية</b><span>تحدث واستمع للإجابة</span></button>
<button class="tile" onclick="show('account')"><span class="ico">👤</span><b>حساب المستخدم</b><span>الدخول والاشتراك</span></button>
<button class="tile" onclick="show('library')"><span class="ico">📚</span><b>المكتبة الزراعية</b><span>معلومات أساسية للفلاح</span></button>
<button class="tile" onclick="show('farm')"><span class="ico">🚜</span><b>إدارة المزرعة</b><span>تنظيم الحقول والعمليات</span></button>
</div><div id="page" class="panel" hidden></div></main>
<nav><button class="active" onclick="show('home',this)">الرئيسية</button><button onclick="show('assistant',this)">المساعد</button><button onclick="show('diagnosis',this)">تشخيص الصور</button><button onclick="show('calculator',this)">الحاسبات</button><button onclick="show('weather',this)">الطقس</button><button onclick="show('account',this)">حسابي</button></nav>
<footer>© Nouradine Agriculture · الإرشادات لا تعوّض تحليل التربة أو تشخيص المختص عند الحاجة.</footer>
<script>
const page=document.getElementById('page'),home=document.getElementById('home');let recognition;
const views={
assistant:`<h3>🤖 المساعد الزراعي الذكي</h3><p class="muted">اكتب سؤالك بالعربية أو بالدارجة الجزائرية. الردود الذكية المباشرة تحتاج ربط خادم ذكاء اصطناعي ومفتاح خدمة آمن.</p><label>سؤالك</label><textarea id="q" placeholder="مثلاً: الطماطم راهي تصفر، واش ندير؟"></textarea><button onclick="ask()">إرسال السؤال</button><div id="answer" class="result" hidden></div>`,
diagnosis:`<h3>📷 تشخيص أمراض النباتات بالصور</h3><p class="muted">ارفع صورة واضحة للنبات. التحليل الآلي للصورة يحتاج خدمة رؤية مرتبطة بالخادم؛ لا يصدر هذا النموذج تشخيصاً طبياً زراعياً مؤكداً.</p><label>صورة النبات</label><input id="plantPhoto" type="file" accept="image/*" capture="environment" onchange="previewPhoto()"><div id="preview"></div><label>ملاحظات الأعراض</label><textarea id="symptoms" placeholder="متى بدأت الأعراض؟ وهل انتشرت في الحقل؟"></textarea><button onclick="diagnose()">إرسال للتشخيص</button><div id="diagResult" class="result" hidden></div>`,
crops:`<h3>🌿 موسوعة المحاصيل</h3><label>اختر المحصول</label><select id="crop"><option>الطماطم</option><option>البطاطا</option><option>القمح</option><option>الزيتون</option><option>الفلفل</option><option>البصل</option><option>أشجار الفاكهة</option></select><p class="muted">تُنظم الموسوعة معلومات الصنف، موعد الزراعة، مراحل النمو، الري، التغذية، الأعراض الشائعة والحصاد. يلزم استكمال المحتوى المحلي المراجع لكل محصول ومنطقة.</p>`,
soil:`<h3>🪴 تحليل التربة</h3><p class="muted">أدخل نتائج مخبرية إن توفرت. لا يمكن تحديد احتياجات التربة بدقة من اللون أو الصورة وحدهما.</p><label>درجة الحموضة pH</label><input id="ph" type="number" step=".1" placeholder="مثلاً 7.5"><label>الملوحة EC (إن توفرت)</label><input id="ec" type="number" step=".1" placeholder="مثلاً 1.2"><label>نوع التربة</label><select id="soilType"><option>رملية</option><option>طينية</option><option>طميية</option><option>مختلطة</option><option>لا أعرف</option></select><button onclick="soilCheck()">حفظ النتائج</button><div id="soilOut" class="result" hidden></div>`,
fertilizer:`<h3>🧪 دليل الأسمدة والتسميد</h3><p class="muted">يشمل الدليل الأسمدة العضوية والمعدنية وNPK والعناصر الصغرى وتوقيت الإضافة والسلامة. الجرعات تعتمد على تحليل التربة والماء والمحصول والمرحلة، ولا تُحدد عشوائياً.</p><label>المحصول</label><input placeholder="اسم المحصول"><label>ملاحظات أو نتائج تحليل</label><textarea placeholder="اكتب ما لديك من معلومات"></textarea>`,
pests:`<h3>🐛 الآفات والأمراض والمكافحة الآمنة</h3><p class="muted">ابدأ بالتشخيص الصحيح، ثم النظافة الزراعية والدورة الزراعية والمصائد والمكافحة الحيوية. عند استخدام مبيد: اتبع الملصق المحلي ومعدات الوقاية وفترة ما قبل الجني وفترة إعادة الدخول. لا تخلط المبيدات دون توجيه موثوق.</p><label>وصف الآفة أو المرض</label><textarea placeholder="صف الحشرة أو البقع أو الضرر..."></textarea>`,
calculator:`<h3>🧮 حاسبة مياه الري</h3><label>المساحة (هكتار)</label><input id="area" type="number" value="1" min="0"><label>معدل التدفق (م³/ساعة)</label><input id="flow" type="number" value="4" min="0"><label>مدة التشغيل (ساعة)</label><input id="hours" type="number" value="2" min="0"><button onclick="calc()">احسب كمية الضخ</button><div id="calcOut" class="result" hidden></div><hr><h3>حاسبة التسميد</h3><p class="muted">أدخل جرعة موصى بها من تحليل أو مختص لحساب الكمية الإجمالية فقط.</p><label>الجرعة الموصى بها (كغ/هكتار)</label><input id="dose" type="number" min="0"><label>المساحة (هكتار)</label><input id="fertArea" type="number" min="0"><button onclick="fertCalc()">احسب الكمية الإجمالية</button><div id="fertOut" class="result" hidden></div>`,
weather:`<h3>☀️ الطقس الزراعي</h3><label>المدينة أو المنطقة</label><input id="city" value="Batna" placeholder="مثلاً خنشلة أو بسكرة"><button onclick="weather()">جلب الطقس</button><div id="weatherOut" class="result" hidden></div><p class="muted">الطقس المباشر يحتاج خدمة طقس واتصال إنترنت. التنبيهات الفورية تحتاج إعداد خادم وإذن المستخدم.</p>`,
voice:`<h3>🎙️ المحادثة الصوتية</h3><p class="muted">التعرف على الكلام يعتمد على دعم المتصفح واللغة المتاحة. قراءة النص تستخدم صوت الجهاز.</p><button onclick="listen()">🎤 ابدأ التحدث</button><button class="secondary" onclick="speak()">🔊 اقرأ آخر إجابة</button><label>النص المسموع</label><textarea id="voiceText" placeholder="سيظهر كلامك هنا"></textarea>`,
account:`<h3>👤 حساب المستخدم والاشتراك</h3><p class="muted">تصميم الاشتراك المطلوب: شهر مجاني، ثم 8 دولارات لكل شهرين. يلزم مزود تسجيل دخول ودفع يدعم الجزائر وربط خادم للتحقق من الاشتراكات؛ لا يتم تحصيل أي مبلغ في هذه النسخة.</p><label>البريد الإلكتروني</label><input type="email" placeholder="name@example.com"><label>كلمة المرور</label><input type="password" placeholder="••••••••"><button onclick="alert('تسجيل الدخول غير مفعّل بعد: يلزم ربط خدمة حسابات آمنة.')">تسجيل الدخول</button><button class="secondary" onclick="alert('الاشتراكات والدفع غير مفعّلين بعد.')">تفاصيل الاشتراك</button>`,
library:`<h3>📚 المكتبة الزراعية</h3><p class="muted">أقسام المكتبة: الزراعة المحمية، الخضروات، الأشجار المثمرة، التربة، الري، التسميد، وقاية النبات. ستضاف مقالات موثوقة ومهيأة للمناخ الجزائري.</p>`,
farm:`<h3>🚜 إدارة المزرعة</h3><label>اسم الحقل</label><input id="fieldName" placeholder="مثلاً البيت البلاستيكي 1"><label>المحصول</label><input id="fieldCrop" placeholder="مثلاً طماطم"><label>مهمة أو ملاحظة</label><textarea id="fieldTask" placeholder="موعد السقي أو التسميد أو الملاحظة"></textarea><button onclick="saveTask()">حفظ المهمة على هذا الجهاز</button><div id="tasks" class="result"></div>`
};
function show(id,btn){home.hidden=id!=='home';page.hidden=id==='home';if(id!=='home'){page.innerHTML=views[id]||'';page.scrollIntoView({behavior:'smooth',block:'start'});if(id==='farm')renderTasks()}document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active')}
function ask(){let q=document.getElementById('q').value.trim(),o=document.getElementById('answer');o.hidden=false;o.textContent=q?'وصل سؤالك: '+q+'\nالمساعد الذكي غير موصول بخادم الإجابات بعد. لا أريد إعطاءك جواباً زراعياً آلياً غير موثوق.':'اكتب سؤالك أولاً.'}
function previewPhoto(){let f=document.getElementById('plantPhoto').files[0],p=document.getElementById('preview');p.innerHTML='';if(f){let im=document.createElement('img');im.src=URL.createObjectURL(f);im.style='max-width:100%;max-height:220px;border-radius:12px;margin-top:10px';p.appendChild(im)}}
function diagnose(){let f=document.getElementById('plantPhoto').files[0],s=document.getElementById('symptoms').value,o=document.getElementById('diagResult');o.hidden=false;o.textContent=f?'تم اختيار الصورة '+f.name+'. خدمة تحليل الصور غير مربوطة بالخادم بعد. أضف وصف الأعراض واستعن بمختص قبل استعمال المبيد.':'اختر صورة للنبات أولاً.';if(s)o.textContent+='\nملاحظاتك: '+s}
function soilCheck(){let o=document.getElementById('soilOut');o.hidden=false;o.textContent='تم تسجيل القيم على الشاشة: pH '+(document.getElementById('ph').value||'غير مدخل')+'، EC '+(document.getElementById('ec').value||'غير مدخل')+'، النوع '+document.getElementById('soilType').value+'. يلزم تفسيرها حسب المحصول وطريقة القياس وتحليل مخبري كامل.'}
function calc(){let a=+document.getElementById('area').value,f=+document.getElementById('flow').value,h=+document.getElementById('hours').value,o=document.getElementById('calcOut');o.hidden=false;o.textContent='كمية المياه المضخوخة = '+(f*h).toFixed(2)+' م³ خلال '+h+' ساعة. هذا لا يساوي بالضرورة احتياج المحصول؛ الاحتياج يتطلب بيانات الطقس والتربة والمحصول وكفاءة النظام.'}
function fertCalc(){let d=+document.getElementById('dose').value,a=+document.getElementById('fertArea').value,o=document.getElementById('fertOut');o.hidden=false;o.textContent=d>=0&&a>=0?(d*a).toFixed(2)+' كغ إجمالاً، بناءً على الجرعة التي أدخلتها أنت. تأكد أن الجرعة موصى بها للمحصول والمرحلة.':'أدخل قيماً صحيحة.'}
async function weather(){let c=document.getElementById('city').value.trim(),o=document.getElementById('weatherOut');o.hidden=false;o.textContent='جارٍ جلب الطقس...';try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.55&longitude=6.17&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&timezone=auto');if(!r.ok)throw Error();let j=await r.json();o.textContent='المنطقة: '+c+' (إحداثيات افتراضية لباتنة حالياً)\nالحرارة: '+j.current.temperature_2m+'°C\nالرطوبة: '+j.current.relative_humidity_2m+'%\nالتساقط: '+j.current.precipitation+' مم\nالرياح: '+j.current.wind_speed_10m+' كم/س\nملاحظة: غيّر الإحداثيات إلى موقعك للحصول على طقس منطقتك.'}catch(e){o.textContent='تعذر الاتصال بخدمة الطقس. تحقق من الإنترنت.'}}
function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('التعرف الصوتي غير مدعوم في هذا المتصفح.');return}recognition=new SR();recognition.lang='ar-DZ';recognition.onresult=e=>document.getElementById('voiceText').value=e.results[0][0].transcript;recognition.start()}
function speak(){let t=document.getElementById('voiceText').value;if(!t){alert('لا يوجد نص لقراءته.');return}let u=new SpeechSynthesisUtterance(t);u.lang='ar';speechSynthesis.speak(u)}
function saveTask(){let a=JSON.parse(localStorage.getItem('na_tasks')||'[]');a.push({field:document.getElementById('fieldName').value,crop:document.getElementById('fieldCrop').value,task:document.getElementById('fieldTask').value,date:new Date().toLocaleDateString('ar-DZ')});localStorage.setItem('na_tasks',JSON.stringify(a));renderTasks()}
function renderTasks(){let a=JSON.parse(localStorage.getItem('na_tasks')||'[]');let el=document.getElementById('tasks');if(el)el.textContent=a.length?a.map(x=>x.date+' — '+x.field+' ('+x.crop+'): '+x.task).join('\n'):'لا توجد مهام محفوظة بعد.'}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
