name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q project.zip -d extracted

      - name: Find Gradle wrapper
        id: gradle
        run: |
          WRAPPER=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          echo "project_dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"
          chmod +x "$WRAPPER"

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NouradineAgriculture-APK
          path: '**/build/outputs/apk/debug/*.apk'
