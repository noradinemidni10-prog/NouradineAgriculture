name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract original project
        run: |
          test -f project.zip || { echo "project.zip is missing"; exit 1; }
          mkdir -p extracted
          unzip -q project.zip -d extracted
          echo "Files in original project:"
          find extracted -maxdepth 4 -type f | sort | head -250

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          BUILD="$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [ -n "$SETTINGS" ]; then
            DIR="$(dirname "$SETTINGS")"
          elif [ -n "$BUILD" ]; then
            DIR="$(dirname "$BUILD")"
          else
            echo "No Gradle project found in project.zip."
            echo "Top-level extracted files:"
            find extracted -maxdepth 3 -type f | sort | head -250
            exit 1
          fi
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Android/Gradle project directory: $DIR"

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NouradineAgriculture-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
