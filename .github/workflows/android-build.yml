name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NouradineAgricultureAndroid_phone_build.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q NouradineAgricultureAndroid_phone_build.zip -d extracted
          SETTINGS_FILE="$(find extracted -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found in Android project archive"
            find extracted -maxdepth 3 -type f
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NouradineAgriculture-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
