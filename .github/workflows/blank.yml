name: Validate and check academy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate academy HTML and JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!html.includes('<html lang="ar" dir="rtl">')) throw new Error('Arabic RTL document declaration missing');
          if (!html.includes('أكاديمية نورالدين لمستقبل أفضل')) throw new Error('Academy title missing');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline application script found');
          for (const script of scripts) new vm.Script(script[1]);
          for (const file of ['manifest.webmanifest', 'sw.js', 'icon.svg']) {
            if (!fs.existsSync(file)) throw new Error('Missing PWA asset: ' + file);
          }
          console.log('Arabic RTL, academy title, inline JavaScript and PWA assets validated.');
          NODE
